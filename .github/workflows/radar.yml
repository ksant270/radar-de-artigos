name: Radar de artigos

on:
  schedule:
    - cron: "0 11 * * 1"  # toda segunda às 8h de Belém (11h UTC)
  workflow_dispatch:       # botão "Run workflow", pra rodar na hora

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript -e 'install.packages(c("rentrez", "xml2", "ellmer", "commonmark"))'

      - name: Rodar o radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          ASSINANTES: ${{ secrets.ASSINANTES }}
        run: Rscript radar.R
