name: Radar de artigos

on:
  schedule:
    - cron: "0 11 * * 1"  # toda segunda às 8h de Belém (11h UTC)
  workflow_dispatch:       # botão "Run workflow", pra rodar na hora

jobs:
  radar:
    # Versão fixa do Ubuntu: o "ubuntu-latest" está migrando pro Ubuntu 26,
    # e uma versão fixa evita surpresas com bibliotecas novas.
    runs-on: ubuntu-24.04
    timeout-minutes: 25  # se travar, o GitHub para a execução sozinho
    env:
      LANG: C.UTF-8      # pra os acentos saírem certos
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript -e 'install.packages(c("rentrez", "xml2", "httr2", "jsonlite", "curl", "commonmark"))'

      - name: Rodar o radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          ASSINANTES: ${{ secrets.ASSINANTES }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}  # opcional
        run: |
          set -o pipefail
          Rscript radar.R 2>&1 | tee radar.log

      # Copia o fim da saída do R pra página da execução, que qualquer um vê
      # sem login (o log completo só aparece pra quem está logado). Endereços
      # de e-mail viram <e-mail>.
      - name: Mostrar a saída na página da execução
        if: always()
        run: |
          {
            echo '### Saída do radar'
            echo '```'
            tail -n 80 radar.log 2>/dev/null | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<e-mail>/g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
